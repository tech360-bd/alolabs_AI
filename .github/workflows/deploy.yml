name: Production database-safe deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Required. Set to true to actually deploy to production.'
        required: true
        default: false
        type: boolean
      migrations_approved:
        description: 'Explicitly authorize reviewed, non-destructive production migrations'
        required: true
        default: false
        type: boolean
      run_paid_services:
        description: 'Allow the SSH deploy to the production host to run (default: skipped)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.4'
  DATABASE_URL: 'file:./ci.db'
  NEXTAUTH_SECRET: 'ci-only-not-production'
  CSRF_SECRET: 'ci-only-not-production'
  JWT_SECRET: 'ci-only-not-production'
  API_GATEWAY_SECRET: 'ci-only-not-production'
  # Default deny: the production deploy is a billed, externally-visible action,
  # so it needs an explicit opt-in rather than firing on every push to main.
  # See scripts/ci-paid-services.sh for the resolution rules.
  SKIP_PAID_SERVICES: 'true'

jobs:
  quality-and-safety:
    name: CI quality and production safety hard-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      skip_paid: ${{ steps.paid.outputs.skip_paid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate workflow files
        run: bun run lint:workflows
      - name: Production dependency advisory gate (blocks deployment)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Generate CI Prisma client
        run: bun run db:generate
      - name: Prisma delegate/schema reconciliation
        run: bun run check:prisma-delegates
      - name: TypeScript hard gate
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typescript-errors.txt
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo '## TypeScript diagnostics'
              echo '```text'
              cat /tmp/typescript-errors.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            diagnostic="$(cat /tmp/typescript-errors.txt)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Complete TypeScript diagnostics::${diagnostic}"
            exit "${status}"
          fi
      - name: Resolve paid-services policy
        id: paid
        env:
          CI_RUN_PAID_OVERRIDE: ${{ inputs.run_paid_services == true && 'true' || '' }}
          SKIP_PAID_FROM_VARS: ${{ vars.SKIP_PAID_SERVICES }}
          SKIP_PAID_FROM_SECRET: ${{ secrets.SKIP_PAID_SERVICES }}
        run: |
          effective="${SKIP_PAID_FROM_VARS:-${SKIP_PAID_FROM_SECRET:-true}}"
          echo "skip_paid=$(CI_RUN_PAID_OVERRIDE="${CI_RUN_PAID_OVERRIDE}" SKIP_PAID_SERVICES="${effective}" bash scripts/ci-paid-services.sh)" >> "$GITHUB_OUTPUT"
      - name: Complete test suite
        run: bun run test
        env:
          NODE_ENV: test
          SKIP_PAID_SERVICES: ${{ steps.paid.outputs.skip_paid }}
      - name: ESLint
        run: bun run lint
      - name: Build verification
        run: bun run build
        env:
          NODE_ENV: production
          PORT: '3011'
      - name: Validate artifacts and deployment safety
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          test -d .next/standalone/.next/static
          test -d public
          test -d .next/standalone/public
          bash deploy/scripts/database-safety-scan.sh .
          bash -n deploy/scripts/database-safety-scan.sh
          bash -n deploy/scripts/backup.sh
          bash -n .github/scripts/validate-production-secrets.sh
          bash -n deploy/scripts/deploy.sh
          bash -n deploy/scripts/setup-deploy-target.sh
      - name: Run the repository configuration guards
        # These three are the same dependency-free gates CI runs. The deploy
        # path previously ran none of them, so the gate protecting production
        # was WEAKER than the gate protecting a pull request: a compose/port
        # drift, an unauthenticated API route, or an unpinned third-party
        # action could reach production without ever failing a check here.
        run: |
          node scripts/validate-compose.mjs
          node scripts/validate-route-auth.mjs
          node scripts/validate-workflow-security.mjs
      - name: Stage reviewed safety scripts
        run: |
          mkdir -p production-safety-scripts/lib
          install -m 600 deploy/scripts/lib/review-migrations.mjs production-safety-scripts/lib/review-migrations.mjs
          install -m 600 deploy/scripts/lib/release-pointer.sh production-safety-scripts/lib/release-pointer.sh
          install -m 600 deploy/scripts/lib/approved-revision.sh production-safety-scripts/lib/approved-revision.sh
          install -m 600 deploy/scripts/lib/publish-snapshot.py production-safety-scripts/lib/publish-snapshot.py
          install -m 600 deploy/scripts/lib/mysql-dump.mjs production-safety-scripts/lib/mysql-dump.mjs
          install -m 600 deploy/scripts/lib/portable-coreutils.sh production-safety-scripts/lib/portable-coreutils.sh
          install -m 700 deploy/scripts/deploy.sh production-safety-scripts/deploy.sh
          install -m 700 deploy/scripts/backup.sh production-safety-scripts/backup.sh
          install -m 700 deploy/scripts/database-safety-scan.sh production-safety-scripts/database-safety-scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-safety-scripts
          path: production-safety-scripts
          if-no-files-found: error
          retention-days: 1

  deployment-config:
    name: Deploy configuration (production bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    environment: production
    # EXPLICIT APPROVAL GATE.
    #
    # A push may run quality checks, but only a manually confirmed dispatch can
    # contact production. Repository/environment settings can change independently.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require verified production build and checks for the approved main commit
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.sha }}
        run: bash .github/scripts/require-release-checks.sh
      # Reports every missing or malformed PRODUCTION_* value at once, by name
      # only. Nothing secret is echoed. Runs as its own job so a configuration
      # problem is distinguishable from a deployment failure at a glance.
      - name: Validate required production SSH secrets
        env:
          PRODUCTION_HOST_FINGERPRINT: ${{ secrets.PRODUCTION_HOST_FINGERPRINT }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: bash .github/scripts/validate-production-secrets.sh

  deploy:
    name: Deploy production
    needs: [quality-and-safety, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-safety-scripts
          path: production-safety-scripts
      - name: Require the production host pin in this job
        env:
          HOST_PIN: ${{ secrets.PRODUCTION_HOST_FINGERPRINT }}
        run: '[[ "$HOST_PIN" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]'
      - name: Create a private staging directory (refuse any pre-existing path)
        # /tmp is world-writable. The scp below writes into
        # /tmp/alo-deploy-<run_id>-<run_attempt>, and that directory is later
        # executed with `sudo`. If another local user pre-created that path —
        # in particular as a symlink to somewhere like /etc — the scp would
        # follow it and the subsequent `chmod 700 .../*.sh` + `sudo bash` would
        # operate on attacker-influenced files. So create it first, as the
        # deploy user, mode 0700, and FAIL if anything is already there.
        # `mkdir` without -p refuses an existing path; the -L test additionally
        # catches a dangling symlink, which -e misses.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          fingerprint: ${{ secrets.PRODUCTION_HOST_FINGERPRINT }}
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          script: |
            set -eu
            D="/tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}"
            if [ -e "$D" ] || [ -L "$D" ]; then
              echo "REFUSING: staging path already exists: $D" >&2
              ls -ld "$D" >&2 || true
              exit 1
            fi
            mkdir -m 700 "$D"
            ls -ld "$D"
      - name: Transfer reviewed safety scripts without changing production
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          fingerprint: ${{ secrets.PRODUCTION_HOST_FINGERPRINT }}
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          source: production-safety-scripts/*
          target: /tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: true
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          APPROVED_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          MIGRATIONS_APPROVED: ${{ inputs.migrations_approved || 'false' }}
          PRODUCTION_APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
        with:
          fingerprint: ${{ secrets.PRODUCTION_HOST_FINGERPRINT }}
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          command_timeout: 30m
          envs: MIGRATIONS_APPROVED,PRODUCTION_APP_DIR,APPROVED_SHA,DEPLOY_RUN_ID
          script: |
            set -euo pipefail
            TEMP_DIR=/tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
            trap 'rm -rf "${TEMP_DIR}"' EXIT
            chmod 700 "${TEMP_DIR}"/*.sh
            APP_DIR="${PRODUCTION_APP_DIR:-}"
            if [ -z "$APP_DIR" ]; then
              for candidate in /opt /home/aloedu/alolabs_AI; do
                if [ -f "$candidate/deploy/scripts/backup.sh" ]; then
                  APP_DIR="$candidate"
                  break
                fi
              done
            fi
            if [ -z "$APP_DIR" ]; then
              echo "ERROR: no application directory found (PRODUCTION_APP_DIR, /opt, /home/aloedu/alolabs_AI)."
              exit 1
            fi
            echo "Application directory: ${APP_DIR}"
            sudo -n APP_DIR="${APP_DIR}" APPROVED_SHA="${APPROVED_SHA}" DEPLOY_RUN_ID="${DEPLOY_RUN_ID}" SAFETY_SCRIPT_DIR="${TEMP_DIR}" \
              MIGRATIONS_APPROVED="${MIGRATIONS_APPROVED}" bash "${TEMP_DIR}/deploy.sh"
