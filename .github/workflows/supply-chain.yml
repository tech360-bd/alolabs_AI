name: Supply Chain (PR Dependency Review)

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Dependency Review only reads the PR diff and dependency manifests.
permissions:
  contents: read
  pull-requests: read

env:
  # Default deny. The dependency review API is free, so nothing is currently
  # gated on this flag; it is wired through so every workflow resolves the
  # flag identically.
  # Rules: scripts/ci-paid-services.sh (unit-tested).
  SKIP_PAID_SERVICES: 'true'

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review new dependencies against known vulnerabilities
        uses: actions/dependency-review-action@31c9f175b9cbbdee66d6ab34ed35e2c827f8be10 # v4.7.4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
