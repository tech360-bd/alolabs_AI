# Weekly AI model discovery (Phase 12); licences require human review.
#
# Read-only: fetches public model catalogues, produces a Markdown report for
# human review, and opens/updates a tracking issue for authorized internal
# administrators. It NEVER activates, replaces or routes production models.
name: Weekly Model Discovery

on:
  schedule:
    # Mondays 06:17 UTC — off-peak, distinct from other jobs.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Test discovery price filtering and report
        run: node --test __tests__/scripts/model-discovery.node-test.mjs

      - name: Run discovery script
        id: discovery
        run: |
          mkdir -p /tmp/discovery
          node scripts/model-discovery.mjs --out /tmp/discovery/report.md
          # Truncate for the issue body (GitHub caps bodies at 65536 chars).
          head -c 50000 /tmp/discovery/report.md > /tmp/discovery/body.md
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact (90 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-discovery-${{ steps.discovery.outputs.date }}
          path: /tmp/discovery/report.md
          retention-days: 90

      - name: Open or update the administrator review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="model-discovery"
          gh label create "$LABEL" --description "Weekly open-source model discovery (human review required)" --color 1D76DB --force 2>/dev/null || true

          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number' || echo "")
          TITLE="Weekly AI model discovery — ${{ steps.discovery.outputs.date }} (human review required)"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$(cat /tmp/discovery/body.md)"
            gh issue edit "$EXISTING" --title "$TITLE"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$(cat /tmp/discovery/body.md)"
          fi
