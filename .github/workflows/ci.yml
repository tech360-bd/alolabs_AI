name: CI

on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main, develop, 'arena/**']
  workflow_dispatch:
    inputs:
      run_paid_services:
        description: 'Allow billed / external-service steps to run (default: skipped)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege. CI only reads the checkout; it never writes to the repo, so
# the default GITHUB_TOKEN is narrowed to contents:read. Without this the token
# inherits the repository default, which may be write.
# Ref: https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

env:
  # Repository CI baseline; production reports its independently installed version.
  BUN_VERSION: '1.3.4'
  DATABASE_URL: 'file:./ci.db'
  NEXTAUTH_SECRET: 'ci-only-not-production'
  CSRF_SECRET: 'ci-only-not-production'
  JWT_SECRET: 'ci-only-not-production'
  API_GATEWAY_SECRET: 'ci-only-not-production'
  # Default deny. Paid / externally-billed steps run only on an explicit
  # opt-in: set the repository Variable (or Secret) SKIP_PAID_SERVICES=false,
  # or tick `run_paid_services` on a workflow_dispatch run. Resolution lives in
  # scripts/ci-paid-services.sh, which is unit-tested.
  SKIP_PAID_SERVICES: 'true'

jobs:
  quality:
    name: TypeScript, tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Record tool versions
        run: |
          bun --version
          node --version
          bunx prisma --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Assert the default schema is the SQLite datasource
        # prisma/schema.prisma is the dev/test/CI datasource (SQLite). Production
        # generates its client from prisma/schema.mysql.prisma via deploy.sh
        # (`db:generate:mysql`) — see src/lib/production-database.ts and the
        # mysql.yml workflow. This assertion makes a provider flip fail CI
        # instead of breaking every SQLite-adapter test at runtime.
        run: |
          set -euo pipefail
          grep -Eq 'provider *= *"sqlite"' prisma/schema.prisma \
            || { echo 'prisma/schema.prisma must stay provider="sqlite" (dev/CI). Production uses prisma/schema.mysql.prisma via deploy.sh / npm run db:generate:mysql.'; exit 1; }
      - name: Assert the MySQL schema is in sync with the SQLite schema
        # prisma/schema.mysql.prisma is generated from prisma/schema.prisma by
        # scripts/generate-mysql-schema.ts. Nothing regenerated-and-diffed it,
        # so a model added to only one file reached production undetected. The
        # generator is idempotent; any diff here means the two schemas drifted.
        run: |
          set -euo pipefail
          bun run db:generate:schema
          if ! git diff --exit-code -- prisma/schema.mysql.prisma; then
            echo 'prisma/schema.mysql.prisma is out of date. Run `npm run db:generate:schema` and commit the result.'
            exit 1
          fi
      - name: Validate workflow files
        # Catches unpinned actions and context-availability mistakes (for
        # example `secrets` in `jobs.<job_id>.if`, where it is not allowed)
        # before they fail a run at the GitHub level.
        run: bun run lint:workflows
      - name: Production dependency advisory gate
        run: npm audit --omit=dev --audit-level=moderate
      - name: Generate test Prisma client
        run: bun run db:generate
      - name: Prisma delegate/schema reconciliation
        run: bun run check:prisma-delegates
      - name: TypeScript hard gate
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typescript-errors.txt
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo '## TypeScript diagnostics'
              echo '```text'
              cat /tmp/typescript-errors.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            diagnostic="$(cat /tmp/typescript-errors.txt)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Complete TypeScript diagnostics::${diagnostic}"
            exit "${status}"
          fi
      - name: Typecheck test sources and fixtures
        run: bun run typecheck:tests
      - name: Resolve paid-services policy
        id: paid
        env:
          CI_RUN_PAID_OVERRIDE: ${{ inputs.run_paid_services == true && 'true' || '' }}
          SKIP_PAID_FROM_VARS: ${{ vars.SKIP_PAID_SERVICES }}
          SKIP_PAID_FROM_SECRET: ${{ secrets.SKIP_PAID_SERVICES }}
        run: |
          effective="${SKIP_PAID_FROM_VARS:-${SKIP_PAID_FROM_SECRET:-true}}"
          echo "skip_paid=$(CI_RUN_PAID_OVERRIDE="${CI_RUN_PAID_OVERRIDE}" SKIP_PAID_SERVICES="${effective}" bash scripts/ci-paid-services.sh)" >> "$GITHUB_OUTPUT"
      - name: Complete test suite
        # SKIP_PAID_SERVICES is published to the job env by the resolve step.
        # While it is active the suite-level fetch guard rejects any
        # non-loopback request, and `itPaid`/`describePaid` specs are reported
        # as skipped rather than silently passing.
        run: bun run test
        env:
          NODE_ENV: test
          SKIP_PAID_SERVICES: ${{ steps.paid.outputs.skip_paid }}
      - name: ESLint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee /tmp/eslint-errors.txt
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo '## ESLint diagnostics'
              echo '```text'
              cat /tmp/eslint-errors.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            diagnostic="$(cat /tmp/eslint-errors.txt)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Complete ESLint diagnostics::${diagnostic}"
            exit "${status}"
          fi
      - name: Production build verification
        run: bun run build
        env:
          NODE_ENV: production
          PORT: '3011'
      - name: Verify standalone artifacts
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          test -d .next/standalone/.next/static
          test -d public
          test -d .next/standalone/public
      - name: Verify database command safety
        run: bash deploy/scripts/database-safety-scan.sh .
      - name: Validate compose and deploy configuration
        # Dependency-free cross-file check: catches phantom services, broken
        # depends_on targets, app-port drift, and unreachable Caddy upstreams.
        # Runs without Docker so it works on every runner.
        run: node scripts/validate-compose.mjs
      - name: Validate API route auth coverage
        # Dependency-free. src/proxy.ts is the Next 16 edge gate and is
        # fail-closed, but it only checks that a Bearer token is PRESENT — the
        # authoritative session/tenant check is per-route via requireAuth().
        # A route that is neither allowlisted nor auth-checked is reachable with
        # `Authorization: Bearer x`, and fails silently. This makes it a build
        # failure instead. Also reports routes made public incidentally by a
        # startsWith() prefix match on a broader allowlist entry.
        run: node scripts/validate-route-auth.mjs
      - name: Validate GitHub Actions workflow security
        # Dependency-free. Guards the three workflow defects found by hand:
        # mutable action tags (re-pointable by upstream, in jobs holding the
        # production SSH key), a missing least-privilege `permissions:` block,
        # and secret names that drift between docs/CI-CD-GUIDE.md and the
        # workflows (DEPLOY_* vs PRODUCTION_* made the documented setup unable
        # to deploy). Also rejects interpolating secrets straight into `run:`.
        run: node scripts/validate-workflow-security.mjs

  login-browser:
    name: Login and MFA (isolated Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --no-audit
      - run: npm run db:generate:client-engine
      - name: Isolated reliability regressions
        run: |
          node --test tests/reliability/*.test.mjs
          python3 tests/reliability/snapshots.py
          bash tests/reliability/revision.sh
          bash tests/reliability/release.sh
          bash tests/reliability/failures.sh
          bash tests/reliability/checks.sh
          bash tests/reliability/host-key.sh
          npm ci --prefix tests/reliability
          PATH="$PWD/tests/reliability/node_modules/.bin:$PATH" bash tests/reliability/pm2.sh
      - run: npm ci --prefix tests/browser
      - name: Select a Chromium executable
        working-directory: tests/browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "TEST_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm test --prefix tests/browser
