# ============================================================
# ALO Labs AI-EOS — Prometheus Configuration
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── Next.js App Metrics ─────────────────────────────────────
  - job_name: 'ai-eos-app'
    metrics_path: '/api/metrics/prometheus'
    authorization:
      credentials_file: /run/secrets/metrics_scrape_token
    static_configs:
      - targets: ['app:3011']
    scrape_interval: 10s

  # ── Prometheus Self-Monitoring ──────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
