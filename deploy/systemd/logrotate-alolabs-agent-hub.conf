# ============================================================
# ALO Labs AgentOS — log rotation for the bare-metal (systemd/PM2) path
#
# docs/SECURITY.md has promised `/etc/logrotate.d/alolabs-agent-hub` (30-day
# retention) since the first hardening pass, but no such file existed in the
# repository and no installer created it. On a 520 GB disk shared with other
# projects, an unrotated log is a slow-motion disk-full incident.
#
# Install:
#   sudo install -D -m 0644 deploy/systemd/logrotate-alolabs-agent-hub.conf \
#        /etc/logrotate.d/alolabs-agent-hub
#   sudo logrotate --debug /etc/logrotate.d/alolabs-agent-hub   # dry run
#
# Docker deploy path: not needed. Container stdout is capped by the `logging`
# blocks in docker-compose.capacity.yml instead.
#
# PM2 deploy path: PM2 writes ~/.pm2/logs/*.log outside /opt, so the second
# stanza below also covers it (`su` matters: PM2 runs as the app user, while
# logrotate runs as root and would otherwise rewrite the file as root:root).
# ============================================================

# ── systemd (journald captures stdout; files appear only if redirected) ──
/opt/alolabs/agent-hub/logs/*.log {
    daily
    rotate 30
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su alohub alohub
}

# ── PM2 (ecosystem.config.js) ──
/home/*/.pm2/logs/alolabs-agentos-*.log {
    daily
    rotate 30
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
