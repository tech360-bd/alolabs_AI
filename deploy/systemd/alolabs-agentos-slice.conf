# ============================================================
# ALO Labs AgentOS — cgroup v2 slice for a SHARED host
#
# Install on a 16 GB host that runs this project alongside others.
#
#   sudo install -D -m 0644 deploy/systemd/alolabs-agentos-slice.conf \
#        /etc/systemd/system/alolabs-agentos.slice
#   sudo systemctl daemon-reload
#   systemctl show alolabs-agentos.slice -p MemoryMin -p MemoryMax -p CPUWeight
#
# Then attach the app to the slice. Two supported deploy paths:
#
#   A. systemd (bare metal):
#        add  Slice=alolabs-agentos.slice  under [Service] in
#        deploy/systemd/alolabs-agent-hub.service, daemon-reload, restart.
#
#   B. Docker:
#        Docker services are NOT children of this slice by default. Either
#        (i) put the compose project in the slice via
#             /etc/systemd/system/docker-compose@alolabs.service  with
#             Slice=alolabs-agentos.slice, or
#        (ii) accept the per-container `mem_limit` ceilings from
#             docker-compose.capacity.yml and treat this slice as the
#             bare-metal path only.
#
# MEMORY vs. docker-compose.capacity.yml
#   mem_limit  = a CEILING. Stops one container from growing unbounded.
#   MemoryMin  = a RESERVATION (soft, cgroup v2). Other slices may borrow the
#                memory, but the kernel will reclaim it from them before it
#                pushes this slice below its floor.
#   MemoryMax  = a HARD wall. Exceeding it OOM-kills inside this slice instead
#                of letting the kernel pick a victim in someone else's project.
#   You want both. Ceilings prevent runaway; reservations prevent starvation.
#
# SIZING (16 GB host, this project first — docs/SERVER_CAPACITY_PLAN.md §2)
#   core stack ceiling            7.5 GB
#   headroom for build/backup     2.5 GB   (next build needs ~2 GB)
#   ----------------------------------------
#   slice ceiling                10.0 GB   -> leaves ~6 GB for other projects
#   slice floor (reserved)        5.0 GB   -> this app keeps working even when
#                                             the host is under pressure
#
# DO NOT set MemoryMin near MemoryMax: a reservation that large makes the host
# unswappable under pressure. 50% of the ceiling is the sane ratio.
# ============================================================

[Unit]
Description=ALO Labs AgentOS resource slice (shared 16 GB host)

[Slice]
# ── Memory ───────────────────────────────────────────────────
MemoryMin=5G
MemoryHigh=8G
MemoryMax=10G
# Never let a memory spike in another project trigger the host-wide OOM
# killer against this slice's working set.
MemoryAccounting=yes
MemorySwapMax=2G

# ── CPU ──────────────────────────────────────────────────────
# Relative weight (default 100). 200 means this slice gets twice the CPU time
# of a default-weight sibling when both are busy; it does NOT cap the slice.
# The hard cap is CPUQuota on the individual unit (200% = 2 cores).
CPUAccounting=yes
CPUWeight=200

# ── I/O ──────────────────────────────────────────────────────
# Protect MariaDB/Qdrant from a neighbour saturating the shared SSD.
IOAccounting=yes
IOWeight=200

# ── Process cap ──────────────────────────────────────────────
# Next.js, the in-process worker and Prisma connections stay far below this.
TasksMax=8192
