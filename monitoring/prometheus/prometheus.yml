global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'alolabs-aios'
    static_configs:
      - targets: ['host.docker.internal:3011']
    metrics_path: '/api/metrics/prometheus'
    authorization:
      credentials_file: /run/secrets/metrics_scrape_token
    scrape_interval: 30s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
