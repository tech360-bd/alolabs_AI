global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

# Operator supplies an Alertmanager-compatible webhook, not an unauthenticated
# POST into one of the application's protected administration APIs.
receivers:
  - name: 'default'
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
